<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Nummern-Badge: drei UI-Varianten</title>
<style>
@font-face { font-family: "Avenir Next LT"; src: url("assets/fonts/AvenirNext-Bold.ttf") format("truetype"); font-weight: 700; }
@font-face { font-family: "Avenir Next LT"; src: url("assets/fonts/AvenirNext-DemiBold.ttf") format("truetype"); font-weight: 600; }
:root {
  --raum: #030309; --weiss: #F4F6FF; --w-45: rgba(244,246,255,.45);
  --hairline: rgba(244,246,255,.14); --hairline-stark: rgba(244,246,255,.28);
  --purple: #C15DE6; --blau: #009FF4; --cyan: #00E2E2; --warn: #ff6b5e; --ok: #3ad29f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--raum); font-family: "Avenir Next LT", sans-serif; color: var(--weiss); }
.reihe {
  width: 1920px; padding: 70px 130px; display: flex; gap: 120px; align-items: center;
  border-bottom: 1px solid var(--hairline);
}
.name { flex: 0 0 360px; font-size: 40px; font-weight: 700; color: var(--weiss); }
.name small { display: block; font-size: 22px; font-weight: 600; color: var(--w-45); margin-top: 10px; letter-spacing: .06em; }
.kopf { display: flex; align-items: center; gap: 20px; }
.label { font-weight: 600; font-size: 21px; letter-spacing: .16em; text-transform: uppercase; color: var(--w-45); }

/* V1: Verlaufs-Ring — der Markenverlauf als Kontur, Zahl weiß */
.ring { width: 74px; height: 74px; border-radius: 50%; padding: 3px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--purple), var(--blau) 52%, var(--cyan)); }
.ring b { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%;
  background: #070a14; font-size: 33px; font-weight: 700; color: var(--weiss); }
.ring.warn { background: linear-gradient(135deg, #ff8a7d, var(--warn)); }
.ring.ok { background: linear-gradient(135deg, #7de8c3, var(--ok)); }

/* V2: Voll-Verlauf — gefüllter Kreis, Zahl dunkel, wie ein Knopf */
.voll { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
  background: linear-gradient(135deg, var(--purple), var(--blau) 52%, var(--cyan));
  font-size: 34px; font-weight: 700; color: #06070f; }
.voll.warn { background: linear-gradient(135deg, #ff8a7d, var(--warn)); }
.voll.ok { background: linear-gradient(135deg, #7de8c3, var(--ok)); }

/* V3: Squircle — abgerundetes Quadrat wie ein App-Symbol, Zahl im Verlauf */
.sq { width: 74px; height: 74px; border-radius: 24px; display: grid; place-items: center; flex-shrink: 0;
  background: rgba(12, 16, 30, .85); border: 1px solid var(--hairline-stark); }
.sq b { font-size: 34px; font-weight: 700;
  background: linear-gradient(135deg, var(--purple), var(--blau) 52%, var(--cyan));
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.sq.warn b { background: linear-gradient(135deg, #ff8a7d, var(--warn)); -webkit-background-clip: text; background-clip: text; }
.sq.ok b { background: linear-gradient(135deg, #7de8c3, var(--ok)); -webkit-background-clip: text; background-clip: text; }
</style>
</head>
<body>

<div class="reihe" id="v1">
  <div class="name">1 · Verlaufs-Ring<small>Markenverlauf als Kontur, innen dunkel</small></div>
  <div class="kopf"><span class="ring warn"><b>1</b></span><span class="label">Kommt rein</span></div>
  <div class="kopf"><span class="ring"><b>2</b></span><span class="label">Ihr tippt</span></div>
  <div class="kopf"><span class="ring ok"><b>3</b></span><span class="label">Geht raus</span></div>
</div>

<div class="reihe" id="v2">
  <div class="name">2 · Voll-Verlauf<small>gefüllter Kreis, Zahl dunkel, wie ein Knopf</small></div>
  <div class="kopf"><span class="voll warn">1</span><span class="label">Kommt rein</span></div>
  <div class="kopf"><span class="voll">2</span><span class="label">Ihr tippt</span></div>
  <div class="kopf"><span class="voll ok">3</span><span class="label">Geht raus</span></div>
</div>

<div class="reihe" id="v3">
  <div class="name">3 · Squircle<small>App-Symbol-Form, Zahl im Verlauf</small></div>
  <div class="kopf"><span class="sq warn"><b>1</b></span><span class="label">Kommt rein</span></div>
  <div class="kopf"><span class="sq"><b>2</b></span><span class="label">Ihr tippt</span></div>
  <div class="kopf"><span class="sq ok"><b>3</b></span><span class="label">Geht raus</span></div>
</div>

</body>
</html>
